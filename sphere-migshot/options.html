<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sphere MIGshot Settings</title>
  <style>
    body {
      font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0f1115;
      color: #e6edf3;
      margin: 0;
      padding: 0;
    }
    .header {
      background: linear-gradient(135deg, #10222e 0%, #11151c 100%);
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #2a313d;
    }
    .header h1 {
      color: #e6edf3;
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .container {
      max-width: 520px;
      margin: 30px auto;
      background: #161a22;
      border: 1px solid #2a313d;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #8b949e;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 9px;
      border: 1px solid #2a313d;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
      background: #eef0f7;
      color: #1a1f2e;
    }
    .field input:focus {
      border-color: #0088D9;
      outline: none;
    }
    .field .hint {
      font-size: 10px;
      color: #8b949e;
      margin-top: 4px;
    }
    .token-row {
      display: flex;
      gap: 8px;
    }
    .token-row input {
      flex: 1;
    }
    .token-row button {
      width: auto;
      padding: 0 14px;
      margin: 0;
    }
    button {
      padding: 10px 18px;
      background: #0088D9;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #78CDFF; color: #11151c; }
    button:disabled {
      background: #2a313d;
      color: #8b949e;
      cursor: not-allowed;
      box-shadow: none;
    }
    button.secondary {
      background: #1d2330;
      color: #e6edf3;
    }
    button.secondary:hover { background: #2a313d; color: #e6edf3; }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }
    .status {
      margin-top: 18px;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .status.show { display: block; }
    .status.ok { background: rgba(46, 160, 67, 0.15); color: #2ea043; border-left: 3px solid #2ea043; }
    .status.err { background: rgba(248, 81, 73, 0.15); color: #f85149; border-left: 3px solid #f85149; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Sphere MIGshot Settings</h1>
  </div>
  <div class="container">
    <div class="field">
      <label for="urlInput">Sphere Platform URL</label>
      <input type="text" id="urlInput" placeholder="https://sphere.example.com">
      <div class="hint">Base URL only — no trailing slash. Example: <code>http://127.0.0.1:8000</code></div>
    </div>
    <div class="field">
      <label for="tokenInput">API Token</label>
      <div class="token-row">
        <input type="password" id="tokenInput" placeholder="paste API token">
        <button type="button" class="secondary" id="toggleShowBtn">Show</button>
      </div>
      <div class="hint">Generate at <code>&lt;url&gt;/settings</code> after logging into Sphere.</div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" id="testBtn">Test Connection</button>
      <button type="button" id="saveBtn">Save Settings</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
